# Study area definition for the current pipeline run.
# Every script reads this file so you only change your target area here -
# nothing else in the pipeline should hardcode a place name or boundary.

# --- The wards, and the region they add up to ----------------------------
#
# run_ward.R reads `wards:` to find one ward's boundary; run_region.R merges
# every ward listed here into `region:` and scores them as a single unit.
#
# Adding a ward is: one line here, `Rscript run_ward.R <name>`, then a full
# re-run of run_region.R. That last step is not optional - the region's scores
# are relative to the set of wards in the merge, so a new ward moves the
# existing wards' numbers too.
#
# Find a relation ID by searching openstreetmap.org, opening the matching
# result, and reading "Relation: <name> (<id>)".

region: "Yokohama"

wards:
  Naka-ku: 2689447
  Isogo-ku: 2689464
  Nishi-ku: 2689468
  Minami-ku: 2689452

# Wards not run yet - move one up into `wards:` when you want it included.
#  Minami-ku: 2689452

# --- Which area a run targets --------------------------------------------
#
# Not in this file. The two blocks above are the only copy of "which places
# exist"; the runners derive the output prefix and the boundary from them, so
# there is nothing here to keep in sync and nothing to edit between the ward
# passes and the region pass.
#
# To run a single script on its own, pick the target first - the same call the
# runners make:
#
#   source("R/utils_config.R")
#   use_ward("Nishi-ku")            # for 01-04, 05, 05b, 06-09
#   source("scripts/06_build_hex_grid.R")
#
#   use_region()                    # for 09b, 05c, 10, 10b, 05d, 10c, 11, 12
#   source("scripts/11_export.R")

# --- The same for every area ---------------------------------------------

pbf_path: "/Users/Fil/naturegap-freshclone/pipeline/data/raw/regional/kanto-latest.osm.pbf"   # set this to your actual downloaded
                                             # .osm.pbf - both the road network
                                             # and the boundary are read from it
crs: 4326                       # WGS84 lon/lat - matches OSM, e-Stat, web maps
hex_resolution: 9               # H3 resolution ~0.1 km2/cell - see docs, revisit
                                 # after you see the first render
